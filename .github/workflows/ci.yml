name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system GI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adwaita-1 \
            gir1.2-glib-2.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-wnck-3.0 \
            libglib2.0-bin gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv reusing system GI bindings
        run: uv venv --system-site-packages

      - name: Install project and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest
