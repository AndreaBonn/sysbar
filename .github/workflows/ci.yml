name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system GI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-glib-2.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-wnck-3.0 \
            libglib2.0-bin gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv reusing system GI bindings
        run: uv venv --system-site-packages

      - name: Install project and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --junitxml=test-results.xml

      - name: Generate test badge
        if: github.ref == 'refs/heads/main'
        run: |
          python3 -c "
          import json, os, xml.etree.ElementTree as ET
          root = ET.parse('test-results.xml').getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
          errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
          passed = tests - failures - errors
          badge = {
              'schemaVersion': 1,
              'label': 'tests',
              'message': f'{passed}/{tests} passed' if failures + errors > 0 else f'{passed} passed',
              'color': 'red' if failures + errors > 0 else 'brightgreen',
          }
          os.makedirs('badges', exist_ok=True)
          with open('badges/test-badge.json', 'w') as f:
              json.dump(badge, f)
          "

      - name: Run tests with coverage
        if: github.ref == 'refs/heads/main'
        run: uv run pytest --cov=sysbar --cov-report=json:coverage/coverage-summary.json --no-header -q

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          python3 -c "
          import json, os
          summary_path = 'coverage/coverage-summary.json'
          if not os.path.exists(summary_path):
              badge = {'schemaVersion': 1, 'label': 'coverage', 'message': 'N/A', 'color': 'lightgrey'}
          else:
              with open(summary_path) as f:
                  data = json.load(f)
              pct = round(data['totals']['percent_covered'], 1)
              color = 'brightgreen' if pct >= 90 else 'green' if pct >= 80 else 'yellow' if pct >= 60 else 'red'
              badge = {'schemaVersion': 1, 'label': 'coverage', 'message': f'{pct}%', 'color': color}
          os.makedirs('badges', exist_ok=True)
          with open('badges/coverage-badge.json', 'w') as f:
              json.dump(badge, f)
          "

      - name: Commit badges
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/test-badge.json badges/coverage-badge.json
          git diff --cached --quiet || git commit -m "ci: update badges [skip ci]"
          git push
