[project]
name = "sysbar"
version = "1.1.1"
description = "System tray toolkit for Ubuntu/GNOME: monitor, per-app volume mixer, keep awake, auto-quit, uninstaller, shelf."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AndreaBonn" }]
keywords = ["gnome", "system-tray", "system-monitor", "gtk4", "pipewire"]

# Nota: PyGObject NON e' elencato qui. Il venv usa --system-site-packages e
# riusa python3-gi/GTK4 di sistema (vedi README). Qui solo dipendenze pure-Python.
dependencies = [
    "psutil>=6.1.0",
    "pulsectl>=24.12.0",
    "python-xlib>=0.33",
    "requests>=2.32.0",
]

[project.optional-dependencies]
nvidia = ["pynvml>=12.0.0"]

[project.scripts]
sysbar = "sysbar.__main__:main"

[project.urls]
Homepage = "https://github.com/AndreaBonn/sysbar"
Repository = "https://github.com/AndreaBonn/sysbar"

[dependency-groups]
# PyGObject-stubs e' deliberatamente assente: dipende da PyGObject, che in un
# venv --system-site-packages andrebbe ricompilato da sorgente. mypy tratta i
# namespace GI come non tipizzati (vedi [tool.mypy] sotto). Per gli editor si
# puo' installare a mano: uv pip install --no-deps pygobject-stubs
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysbar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# Le classi GTK/GObject sono non tipizzate (gi e' generato a runtime), quindi
# le sottoclassi (Adw.Application, GObject.Object) richiedono questa deroga.
disallow_subclassing_any = false
# I namespace GI sono generati dinamicamente e privi di stub installati.
[[tool.mypy.overrides]]
module = [
    "gi",
    "gi.repository",
    "gi.repository.*",
    "pulsectl.*",
    "Xlib.*",
    "pynvml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sysbar --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "ui: window construction smoke tests; need a display (run under xvfb)",
]

[tool.coverage.run]
# GUI windows and D-Bus glue are verified manually (no display in CI); coverage
# tracks the framework-agnostic business logic.
omit = [
    "src/sysbar/ui/*",
    "src/sysbar/app/application.py",
    "src/sysbar/app/tray/status_notifier.py",
    "src/sysbar/app/tray/tray.py",
    "src/sysbar/services/keep_awake/inhibitor.py",
    "src/sysbar/services/notifier.py",
    "src/sysbar/services/quick_toggles/adapters.py",
    "src/sysbar/services/hotkey/portal.py",
    "src/sysbar/services/auto_quit/shell_extension_source.py",
    "src/sysbar/services/clipboard/monitor.py",
]

[tool.coverage.report]
# Protocol method bodies are bare ellipses (`def f() -> T: ...`): abstract
# signatures with no executable body, so they are excluded from measurement.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
