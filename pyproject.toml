[project]
name = "sysbar"
version = "0.1.0"
description = "System tray toolkit for Ubuntu/GNOME: monitor, per-app volume mixer, keep awake, auto-quit, uninstaller, shelf."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Linkalab" }]
keywords = ["gnome", "system-tray", "system-monitor", "gtk4", "pipewire"]

# Nota: PyGObject NON e' elencato qui. Il venv usa --system-site-packages e
# riusa python3-gi/GTK4 di sistema (vedi README). Qui solo dipendenze pure-Python.
dependencies = [
    "psutil>=6.1.0",
    "pulsectl>=24.12.0",
    "python-xlib>=0.33",
    "requests>=2.32.0",
]

[project.optional-dependencies]
nvidia = ["pynvml>=12.0.0"]

[project.scripts]
sysbar = "sysbar.__main__:main"

[project.urls]
Homepage = "https://github.com/linkalab/sysbar"
Repository = "https://github.com/linkalab/sysbar"

[dependency-groups]
# PyGObject-stubs e' deliberatamente assente: dipende da PyGObject, che in un
# venv --system-site-packages andrebbe ricompilato da sorgente. mypy tratta i
# namespace GI come non tipizzati (vedi [tool.mypy] sotto). Per gli editor si
# puo' installare a mano: uv pip install --no-deps pygobject-stubs
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "types-requests>=2.32.0",
    "types-psutil>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysbar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# Le classi GTK/GObject sono non tipizzate (gi e' generato a runtime), quindi
# le sottoclassi (Adw.Application, GObject.Object) richiedono questa deroga.
disallow_subclassing_any = false
# I namespace GI sono generati dinamicamente e privi di stub installati.
[[tool.mypy.overrides]]
module = [
    "gi",
    "gi.repository",
    "gi.repository.*",
    "pulsectl.*",
    "Xlib.*",
    "pynvml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sysbar --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
